<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Todo List</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <h1>Список задач</h1>

    <div class="form-group">
      <input type="text" id="task-input" placeholder="Введите задачу...">
      <button id="add-btn">Добавить</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">Все</button>
      <button class="filter-btn" data-filter="active">Активные</button>
      <button class="filter-btn" data-filter="completed">Завершённые</button>
      <button id="clear-completed">Удалить все выполненные задачи</button>
      
    </div>

    <div id="counter">Осталось: 0, Выполнено: 0</div>

    <ul id="todo-list"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
