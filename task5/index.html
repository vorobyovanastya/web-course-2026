<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simon Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <h1>Simon Says</h1>

    <div class="score-board">
      Уровень: <span id="level-display">0</span>
    </div>

    <!-- Игровое поле из 4 секторов -->
    <div class="simon-board">
      <div class="sector green" data-color="0"></div>
      <div class="sector red" data-color="1"></div>
      <div class="sector yellow" data-color="2"></div>
      <div class="sector blue" data-color="3"></div>
    </div>

    <button id="start-btn" class="btn">Старт</button>

    <div id="status-message" class="status-message">Нажмите «Старт», чтобы начать игру!</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
