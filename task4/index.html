<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра «Быки и коровы»</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Игра «Быки и коровы»</h1>
        <p class="rules">Угадайте 4-значное число с неповторяющимися цифрами. Быки — цифры на своих местах, коровы — цифры есть, но не на своих.</p>

        <div class="input">
            <input type="text" id="user-input" placeholder = "Введите 4 разные цифры"> 
            <button id="guess-btn">Проверить</button>
            <button id ="new-game">Новая игра</button>
        </div>
        
        
        <div id="counter">Попыток: 0</div>
        <ul id="history-list"></ul>
        
    </div>

</body>
<script src="script.js"></script>
</html>
